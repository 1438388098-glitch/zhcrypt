name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: 核心三套件 (脚本式回归)
        run: python tests/run_core_tests.py
      - name: pytest 集合 (单元/端点/协议边界)
        run: python -m pytest tests/ -q

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true   # 已知 CVE 门禁先观察, 稳定后改为阻断
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 依赖漏洞扫描
        run: |
          pip install pip-audit
          pip-audit -r requirements-client.lock.txt
          pip-audit -r requirements-server.lock.txt
