name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    # 兜底: 测试套件打印中文, 强制 UTF-8 输出 (脚本内部亦自行 reconfigure,
    # 不依赖控制台代码页, 此处保证 pytest 步骤同样不受 cp1252 影响)。
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: 核心三套件 (脚本式回归)
        run: python tests/run_core_tests.py
      - name: pytest 集合 (单元/端点/协议边界)
        run: python -m pytest tests/ -q

  audit:
    runs-on: ubuntu-latest
    # CVE 门禁必须阻断: 本仓库核心即密码学, 依赖漏洞不可放过。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 依赖漏洞扫描
        run: |
          pip install pip-audit
          pip-audit -r requirements-client.lock.txt
          pip-audit -r requirements-server.lock.txt
